version: "3.8"

# ============================================================================
# TEST CONTAINERS - OPTIONAL
# ============================================================================
# Enable test containers by setting environment variable:
#
#   RUN_TESTS=true docker compose up
#
# This will:
# - Run integration tests after all services are healthy
# - Display test results in docker compose logs
# - Exit with appropriate status code
#
# Default: RUN_TESTS=false (test containers disabled)
# ============================================================================

services:
  zookeeper:
    container_name: notification-zookeeper
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - notification-net

  kafka:
    container_name: notification-kafka
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092" # external access (host)
      - "29092:29092" # internal docker access
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: notification-zookeeper:2181

      # Kafka listeners (internal + external)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://notification-kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24

    networks:
      - notification-net
    healthcheck:
      test:
        ["CMD", "kafka-topics", "--bootstrap-server=localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-init:
    container_name: notification-kafka-init
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: |
      bash -c '
      set -e
      echo "Waiting for Kafka to be ready..."
      sleep 15
      echo "Creating Kafka topics..."
      kafka-topics --create --if-not-exists --topic messages.email --bootstrap-server notification-kafka:29092 --partitions 3 --replication-factor 1
      echo "[OK] Created messages.email"
      kafka-topics --create --if-not-exists --topic messages.sms --bootstrap-server notification-kafka:29092 --partitions 3 --replication-factor 1
      echo "[OK] Created messages.sms"
      kafka-topics --create --if-not-exists --topic messages.whatsapp --bootstrap-server notification-kafka:29092 --partitions 3 --replication-factor 1
      echo "[OK] Created messages.whatsapp"
      kafka-topics --create --if-not-exists --topic logs --bootstrap-server notification-kafka:29092 --partitions 1 --replication-factor 1
      echo "[OK] Created logs"
      kafka-topics --create --if-not-exists --topic dlq.email --bootstrap-server notification-kafka:29092 --partitions 1 --replication-factor 1
      echo "[OK] Created dlq.email"
      kafka-topics --create --if-not-exists --topic dlq.sms --bootstrap-server notification-kafka:29092 --partitions 1 --replication-factor 1
      echo "[OK] Created dlq.sms"
      kafka-topics --create --if-not-exists --topic dlq.whatsapp --bootstrap-server notification-kafka:29092 --partitions 1 --replication-factor 1
      echo "[OK] Created dlq.whatsapp"
      kafka-topics --create --if-not-exists --topic errors --bootstrap-server notification-kafka:29092 --partitions 1 --replication-factor 1
      echo "[OK] Created errors"
      echo "[OK] All topics created successfully!"
      kafka-topics --list --bootstrap-server notification-kafka:29092
      exit 0
      '
    networks:
      - notification-net

  redis:
    container_name: notification-redis
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - notification-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    container_name: notification-mysql
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: harshul12345
      MYSQL_DATABASE: notification_db
      MYSQL_USER: notif_user
      MYSQL_PASSWORD: notif-password
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - notification-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    container_name: notification-elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - notification-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kibana:
    container_name: notification-kibana
    image: docker.elastic.co/kibana/kibana:8.11.0
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://notification-elasticsearch:9200
      xpack.security.enabled: "false"
    depends_on:
      - elasticsearch
    networks:
      - notification-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s http://localhost:5601/api/status >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  task-router:
    container_name: notification-task-router
    # REST API Entry Point (Port 3001)
    # - Validates request payloads
    # - Checks Redis ingress cache (72h TTL) for duplicates
    # - Publishes to: messages.email, messages.sms, messages.whatsapp (unconditionally)
    # - Publishes logs to: logs topic
    # - Does NOT write to MySQL (async in consumer)
    # - Returns 202 ACCEPTED immediately (no DB write)
    build:
      context: .
      dockerfile: ./services/task-router/Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      REDIS_HOST: notification-redis
      REDIS_PORT: 6379
      MYSQL_HOST: notification-mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: harshul12345
      MYSQL_DATABASE: notification_db
      KAFKA_BROKER: notification-kafka:29092
      KAFKAJS_NO_PARTITIONER_WARNING: 1
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - notification-net

  notification-aggregator:
    container_name: notification-aggregator-service
    # Kafka Batch Consumer (Delivery Workers Group)
    # - Consumes message batches from Kafka topics
    # - Performs bulk DB idempotency check (1 query per batch, not N per-message)
    # - Partitions batch into NEW (to process) vs DUPLICATE (skip)
    # - Inserts NEW messages with status=IN_PROGRESS (atomically)
    # - Calls provider APIs with idempotency tokens (messageId)
    # - Updates status to SENT on success
    # - Schedules retries in Redis ZSET on failure
    # - Escalates to DLQ on max attempts
    # - Publishes to: dlq.email, dlq.sms, dlq.whatsapp, logs topic
    build:
      context: .
      dockerfile: ./services/notification-aggregator/Dockerfile
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: development
      PORT: 3002
      REDIS_HOST: notification-redis
      REDIS_PORT: 6379
      MYSQL_HOST: notification-mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: harshul12345
      MYSQL_DATABASE: notification_db
      KAFKA_BROKER: notification-kafka:29092
      KAFKAJS_NO_PARTITIONER_WARNING: 1

      # Provider Success Rate Configuration (0-100, default: 80/85/90)
      # EMAIL_SUCCESS_RATE: 80        # Email: 80% success rate
      # SMS_SUCCESS_RATE: 85           # SMS: 85% success rate
      # WHATSAPP_SUCCESS_RATE: 90      # WhatsApp: 90% success rate

      # Provider Failure Simulation (true to force all failures)
      # EMAIL_SIMULATE_FAILURE: false          # Force all emails to fail
      # SMS_SIMULATE_FAILURE: false            # Force all SMS to fail
      # WHATSAPP_SIMULATE_FAILURE: false       # Force all WhatsApp to fail

      # USAGE EXAMPLES:
      # 1. Test email with 50% success: EMAIL_SUCCESS_RATE=50
      # 2. Force SMS failures: SMS_SIMULATE_FAILURE=true
      # 3. All channels fail: EMAIL_SIMULATE_FAILURE=true SMS_SIMULATE_FAILURE=true WHATSAPP_SIMULATE_FAILURE=true
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - notification-net

  logger:
    container_name: notification-logger-service
    # Log Consumer (Singleton for Total Ordering)
    # - Single instance consumes from logs topic (1 partition)
    # - Preserves total ordering of logs across all services
    # - Writes structured logs to Elasticsearch
    # - Visualizable in Kibana (filter by traceId, status, channel)
    # Consumer Group: logger-group (single instance only)
    build:
      context: .
      dockerfile: ./services/logger/Dockerfile
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: development
      PORT: 3003
      REDIS_HOST: notification-redis
      REDIS_PORT: 6379
      MYSQL_HOST: notification-mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: harshul12345
      MYSQL_DATABASE: notification_db
      KAFKA_BROKER: notification-kafka:29092
      ELASTICSEARCH_HOST: notification-elasticsearch
      ELASTICSEARCH_PORT: 9200
      KAFKAJS_NO_PARTITIONER_WARNING: 1
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - notification-net

  # ========================================================================
  # TEST RUNNER SERVICE (Optional)
  # ========================================================================
  # Runs comprehensive integration tests after all services are healthy
  # Tests include:
  # - DB-anchored idempotency (Redis cache + MySQL authority)
  # - Batch processing with bulk idempotency checks
  # - Duplicate detection (Redis 72h cache, DB fallback)
  # - Multi-tenant isolation
  # - All notification channels (Email, SMS, WhatsApp)
  #
  # Enable with: RUN_TESTS=true docker compose up
  # Or use profiles: docker compose --profile test up
  integration-tests:
    container_name: notification-integration-tests
    image: node:20-alpine
    working_dir: /workspace
    volumes:
      - .:/workspace
    depends_on:
      task-router:
        condition: service_started
      notification-aggregator:
        condition: service_started
      logger:
        condition: service_started
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      NODE_ENV: test
      API_HOST: notification-task-router
      API_PORT: 3001
      MYSQL_HOST: notification-mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: harshul12345
      MYSQL_DATABASE: notification_db
      REDIS_HOST: notification-redis
      REDIS_PORT: 6379
      ELASTICSEARCH_HOST: notification-elasticsearch
      ELASTICSEARCH_PORT: 9200
    networks:
      - notification-net
    # Add small delay to ensure services are ready
    entrypoint: |
      sh -c '
      echo "Waiting for services to be ready..."
      sleep 10
      echo "Running integration tests..."
      npm run test:integration
      '
    # Only start if RUN_TESTS=true or --profile test is used
    profiles:
      - test

networks:
  notification-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  elasticsearch-data:
